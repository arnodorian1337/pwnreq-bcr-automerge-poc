name: Open controlled attacker PR

on:
  workflow_dispatch:
    inputs:
      head:
        description: Branch to open as the controlled Actions-bot attacker
        required: true
      title:
        description: Pull request title
        required: true
      body:
        description: Pull request body
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  open_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR as the controlled attacker identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${{ inputs.head }}" \
            --title "${{ inputs.title }}" \
            --body "${{ inputs.body }}"
