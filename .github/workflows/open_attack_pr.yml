name: Open controlled attacker PR

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR as the controlled attacker identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head attack/bot-extra-file-automerge \
            --title "Add demo module 1.0.1" \
            --body "Controlled security test: one module version plus an unrelated root file. Do not merge manually."
